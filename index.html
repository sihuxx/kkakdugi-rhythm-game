<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꺅두기 러닝비트</title>
<meta name="description" content="꺅두기가 달리며 박자를 밟는 웹 리듬게임. 두기 18종 도감과 클로버 뽑기.">
<link rel="icon" href="assets/clover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="pauseBtn" hidden>일시정지</button>
    <button id="skipBtn" hidden>건너뛰기 ▶▶</button>
    <p id="tapHint" hidden>탭하면 다음</p>
    <div id="homeBar" hidden>
      <span id="homeClover"></span>
      <span class="hc">두기 · <b id="homeChar"></b></span>
      <button id="homeSongBtn" type="button">노래 고르기</button>
      <button id="homeTitleBtn" type="button">타이틀</button>
    </div>

    <section class="screen" id="titleScreen">
      <img class="mascot sway" id="titleArt" alt="꺅두기">
      <h1>꺅두기 러닝비트<span class="sub">GGAKDUGI RUNNING BEAT</span></h1>
      <div class="picks">
        <button class="pick" id="pickChar" type="button"><span class="lb">캐릭터</span><span class="vl">양털 두기</span></button>
        <button class="pick" id="pickSong" type="button"><span class="lb">노래</span><span class="vl">클로버 산책</span></button>
        <button class="pick" id="pickDiff" type="button"><span class="lb">난이도</span><span class="vl">쉬움</span></button>
      </div>
      <p class="tagline" id="tagline"></p>
      <div class="picks">
        <button class="btn" id="startBtn">출발!</button>
        <button class="btn ghost small" id="gachaBtn">뽑기</button>
      </div>
      <p class="wallet" id="wallet"></p>
      <p class="keys"><span class="kbd">A</span> <span class="kbd">S</span> <span class="kbd">K</span> <span class="kbd">L</span> 네 줄로 내려오는 노트 · 길게 누르면 쓰왜</p>
    </section>

    <section class="screen" id="resultScreen" hidden>
      <img class="mascot" id="resultArt" alt="네잎클로버를 든 꺅두기">
      <div class="panel">
        <p class="grade" id="gradeText">세잎</p>
        <p class="score" id="scoreText">0</p>
        <div class="tally">
          <div><b>딱딱</b><span id="tPerfect">0</span></div>
          <div><b>좋아</b><span id="tGood">0</span></div>
          <div><b>아쉬워</b><span id="tOk">0</span></div>
          <div><b>앗</b><span id="tMiss">0</span></div>
          <div><b>최대 콤보</b><span id="tCombo">0</span></div>
          <div><b>정확도</b><span id="tAcc">0%</span></div>
        </div>
        <p class="best" id="bestText"></p>
        <p class="reward" id="rewardText"></p>
      </div>
      <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn" id="retryBtn">한 번 더</button>
        <button class="btn ghost" id="selectBtn">다른 곡</button>
        <button class="btn ghost small" id="resultGachaBtn">뽑기</button>
      </div>
    </section>

    <section class="screen" id="pauseScreen" hidden>
      <h1 style="font-size:clamp(24px,4.6vw,38px)">잠깐 쉬는 중</h1>
      <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn" id="resumeBtn">이어서</button>
        <button class="btn ghost" id="quitBtn">그만</button>
      </div>
    </section>
    <div class="modal" id="modal" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle">누구로 달릴까</h2>
        <div class="row" id="modalBody"></div>
        <p class="keys" id="modalHint"></p>
        <button class="btn ghost small" id="modalClose">확인</button>
      </div>
    </div>
  </div>
  <footer><b>음악</b> 네 곡 모두 이 페이지가 Web Audio로 직접 연주하는 창작 칩튠 — 외부 음원 없음. 폰에서는 네 줄을 손가락으로 두드리면 됩니다.</footer>
</div>
<!-- 순서대로 읽혀야 합니다 -->
<script defer src="js/data.js"></script>
<script defer src="js/chart.js"></script>
<script defer src="js/audio.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/world.js"></script>
<script defer src="js/render.js"></script>
</body>
</html>
